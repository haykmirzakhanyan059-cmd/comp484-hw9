<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8" />
            <title>JavaScript Mini Demo</title>
        </head>
        <body>
            <h1>JavaScript Mini Demo</h1>
            <!-- Date Section -->
            <h2>Date Display</h2>
            <p id="dateOutput">Date will appear here</p>
            <!-- Number Conversion Section -->
            <h2>Number Conversion Tests</h2>
            <div id="numberConversionOutput">Results will appear here</div>
            <!-- Math and Formatting Section -->
            <h2>Math and Number Formatting</h2>
            <div id="mathOutput">Results will appear here</div>

            <!-- Conditionals Section -->
            <h2>Conditionals</h2>
            <div id="conditionalOutput">Results will appear here</div>

            <!-- Link to external JavaScript -->
            <script src="script.js"></script>
            
            <style>
                #numberConversionOutput { /* Makes the item with id "numberConversionOutput" display text with preserved line breaks */
                    white-space: pre-line;/* This CSS property ensures that line breaks in the text content are preserved when displayed in the browser. */
                    /*white-space controls how the browser displays spaces, tabs, and line breaks inside an element. */
                }
                #mathOutput { /* Makes the item with id "mathOutput" display text with preserved line breaks */
                    white-space: pre-line;
                }
                #conditionalOutput { /* Makes the item with id "conditionalOutput" display text with preserved line breaks */
                    white-space: pre-line;
                }
            </style>
        </body>
    </html>
